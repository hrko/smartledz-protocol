[settings]
experimental = true
lockfile = true
lockfile_platforms = ["linux-x64", "windows-x64"]

[tools]
python = "3.15.0"
uv = "0.13.0"
"conda:clang-tools" = "22.1.8"
"conda:clang" = "22.1.8"

[tasks.cpp-check]
description = "Check all C++ sources and public headers"
run = "python tools/check_cpp.py"
